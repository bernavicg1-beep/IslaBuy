name: Firestore Rules Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-rules:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Run Security Rules Tests
        # emulators:exec compiles firestore.rules on startup (a syntax error
        # fails this step) and exposes FIRESTORE_EMULATOR_HOST /
        # FIREBASE_AUTH_EMULATOR_HOST to the test script.
        run: firebase emulators:exec --only firestore,auth --project demo-islabuy "python3 scripts/test-firestore-rules.py"

      - name: Stop Emulator
        if: always()
        run: pkill -f firebase || true