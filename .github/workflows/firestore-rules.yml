name: Firestore Rules Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Start Firestore Emulator
        run: |
          firebase emulators:start --only firestore --project demo-islabuy &
          sleep 10

      - name: Compile Security Rules
        run: firebase deploy --only firestore:rules --project demo-islabuy --token ${{ secrets.FIREBASE_TOKEN }} || echo "Deploy skipped (no token)"

      - name: Run Security Tests
        run: python3 scripts/test-firestore-rules.py
        env:
          FIRESTORE_EMULATOR_HOST: localhost:8080

      - name: Stop Emulator
        if: always()
        run: pkill -f firebase || true
