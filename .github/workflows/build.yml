name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk

  build-release:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-debug
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # `secrets` is not available in a step-level `if:`, so the check lives inside the script.
      - name: Decode Keystore
        id: decode
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -uo pipefail
          if [ -z "${KEYSTORE_BASE64// /}" ]; then
            echo "::warning::KEYSTORE_BASE64 secret is empty. Skipping signed release build (debug APK is still produced)."
            echo "keystore_ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' > /tmp/ks.b64
          echo "Diagnostics (no secret values printed):"
          echo "  base64 length: $(wc -c < /tmp/ks.b64) (expected 3684)"
          echo "  starts with MIIKxgIBAzCCCnAG: $(head -c 18 /tmp/ks.b64 | grep -q '^MIIKxgIBAzCCCnAG' && echo yes || echo no)"
          echo "  ends with jMKAdSC8/QICJxA=: $(tail -c 18 /tmp/ks.b64 | grep -q 'jMKAdSC8/QICJxA=$' && echo yes || echo no)"
          if ! base64 -d /tmp/ks.b64 > app/release.keystore 2>/tmp/b64.err; then
            echo "::warning::KEYSTORE_BASE64 is not valid base64. Skipping signed release build. Paste the whole content of islabuy-release.keystore.base64 (one line, 3684 characters, starting with MIIKxgIBAzCCCnAG)."
            echo "  base64 error: $(cat /tmp/b64.err)"
            echo "keystore_ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "  decoded keystore size: $(wc -c < app/release.keystore) (expected 2762)"
          if ! keytool -list -keystore app/release.keystore -storepass "$KEYSTORE_PASSWORD" > /tmp/kt.out 2>/tmp/kt.err; then
            echo "::warning::The decoded keystore does not open with KEYSTORE_PASSWORD. Skipping signed release build. Update the KEYSTORE_BASE64 / KEYSTORE_PASSWORD secrets."
            echo "  keytool error: $(cat /tmp/kt.err)"
            echo "keystore_ok=false" >> "$GITHUB_OUTPUT"
            rm -f app/release.keystore
            exit 0
          fi
          echo "  alias in keystore: $(keytool -list -keystore app/release.keystore -storepass "$KEYSTORE_PASSWORD" 2>/dev/null | grep -i privatekeyentry | head -1 | cut -d, -f1)"
          echo "keystore_ok=true" >> "$GITHUB_OUTPUT"
          echo "Keystore decoded and unlocked."

      - name: Build Release APK & AAB
        if: steps.decode.outputs.keystore_ok == 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease

      - name: Skip Release Build (no valid keystore)
        if: steps.decode.outputs.keystore_ok != 'true'
        run: echo "Skipping signed release build because the keystore secret is missing or invalid. Debug APK is still available as an artifact."

      - name: Upload Release Artifacts
        if: steps.decode.outputs.keystore_ok == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
