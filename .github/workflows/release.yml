name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 1.0.0)'
        required: true
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_BASE64_1: ${{ secrets.KEYSTORE_BASE64_1 }}
          KEYSTORE_BASE64_2: ${{ secrets.KEYSTORE_BASE64_2 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          # Phone clipboards truncate long values; join the two-part secrets when set.
          if [ -n "${KEYSTORE_BASE64_1:-}" ] || [ -n "${KEYSTORE_BASE64_2:-}" ]; then
            KEYSTORE_BASE64="${KEYSTORE_BASE64_1:-}${KEYSTORE_BASE64_2:-}"
          fi
          # Secrets pasted from a phone often carry stray spaces or CRLF; strip all whitespace.
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' > /tmp/ks.b64
          if [ ! -s /tmp/ks.b64 ]; then
            echo "::error::The KEYSTORE_BASE64 secret is empty."
            exit 1
          fi
          if ! base64 -d /tmp/ks.b64 > app/release.keystore 2>/dev/null; then
            echo "::error::KEYSTORE_BASE64 is not valid base64. It should be one line of 3684 characters starting with MIIKxgIBAzCCCnAG."
            python3 -c "import string;b=open('/tmp/ks.b64',encoding='utf-8',errors='replace').read();ok=set(string.ascii_letters+string.digits+'+/=');bad=sorted({c for c in b if c not in ok});print('length:',len(b));print('starts with MII:',b.startswith('MII'));print('outside base64 alphabet:',(' '.join(repr(c) for c in bad) if bad else '(none)'))"
            exit 1
          fi
          keytool -list -keystore app/release.keystore -storepass "$KEYSTORE_PASSWORD" > /dev/null || {
            echo "::error::The decoded keystore does not open with the KEYSTORE_PASSWORD secret."
            exit 1
          }
          echo "Keystore decoded and unlocked."

      - name: Build Signed APK & AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
